[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "code-graph-mcp"
version = "0.1.0"
description = "Local Tree-sitter code knowledge graph & MCP server that gives Claude Code, Cursor and other AI coding agents surgical edit context — cutting token usage by 80-95%."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "model-context-protocol", "mcp-server", "claude-code", "cursor", "code-graph", "knowledge-graph", "tree-sitter", "ast", "llm", "ai-coding-agent", "token-optimization", "code-context", "static-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
authors = [
    { name = "Eray Erturk" }
]
dependencies = [
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "tree-sitter-go>=0.23.0",
    "tree-sitter-c-sharp>=0.23.0",
    "tree-sitter-rust>=0.23.0",
    "tree-sitter-java>=0.23.0",
    "mcp>=1.2.0",
    "pathspec>=0.11.0",
]

[project.urls]
Homepage = "https://github.com/erayerturk/code-graph-mcp"
Repository = "https://github.com/erayerturk/code-graph-mcp"
Issues = "https://github.com/erayerturk/code-graph-mcp/issues"

[project.scripts]
code-graph = "code_graph.cli:main"
code-graph-mcp = "code_graph.mcp_server:run_server"

[tool.setuptools.packages.find]
where = ["src"]
